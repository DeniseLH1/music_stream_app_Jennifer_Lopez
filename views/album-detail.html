<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pagina principal Music Stream">
    <meta name="description" content="HTML,css, pagina web, Music Stream">
    <meta name="description" content="Denise López">
    <meta name="description" content="Music Stream HTML">
    <meta name="generator" content="VScode">
    <link rel="icon" type="image/png" href="/Assets/icons/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/Assets/icons/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/Assets/icons/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/Assets/icons/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/Assets/icons/favicon/site.webmanifest" />
    <title>MusicStream · Álbum</title>
    <link rel="stylesheet" href="../Css/album-details.css">
    <link rel="stylesheet" href="../Css/main.css">
</head>
<body>
    <!-- -------------------Link de arriba------------------ -->
    <header class="global-header ">
        <div class="header-left">
            <img src="../Assets/icons/Logo.png" alt="MusicStream Logo" width="50px">
            <span>MusicStream</span>
        </div>
            <nav class="menu-central" aria-label="Navegación principal">
                <a href="../index.html">Descubrir</a>
                <a href="library.html">Mi biblioteca</a>
                <a href="cart.html">Carrito <span data-cart-count hidden></span></a>
        </nav>
        <div class="header-right">
            <img src="../Assets/icons/nueva-cuenta.png" width="30px" height="30px">
      </div></header>
<!-- ------------Info del album------------------------------ -->
<main class="album-detail-view">
<section class="album-hero">
    <div class="hero-left">
    <img src="../Assets/img/homerun.jpeg" alt="Portada del álbum" class="main-cover" data-album-cover>
        <!-- -----Info debajo de imagen------>
    <div class="album-meta">
    <h1 data-album-title>Homerun</h1>
    <p><a class="artist-name" href="artists.html" data-artist-link data-album-artist>Paulo Londra</a></p>
    </div>
    <!-- -----------Botones------------- -->
    <div class="action-buttons">
    <button class="btn-buy" type="button" data-add-to-cart="homerun" data-default-label="Agregar álbum al carrito - Q100.00">Agregar álbum al carrito - Q100.00</button>
    <div class="secondary-actions">
    <button class="btn-icon" type="button" data-favorite-album aria-pressed="false">♡ Favoritos</button>
    <button class="btn-icon" type="button" data-share>↗ Compartir</button>
    </div></div></div>
    <!-- .-----------TABLA-------------------- -->
    <div class="hero-right">
    <h2>Lista de canciones</h2>
    <div class="tracklist-container">
         <div class="track-header">
         <span>#</span>
         <span>TÍTULO</span>
         <span>ARTISTA</span>
         <span>🕒</span>
         </div>
    <div data-track-rows></div>
</div>
<div class="artist-bio">
<h3>Artista</h3>
<p data-artist-bio>Paulo Londra</p>
</div></div>
</section>
</main>
<!-- -----------------Notones de musica--------------- -->
<footer class="player-bar">
<div class="current-track">
    <img src="../Assets/img/homerun.jpeg"  width="30%" height="30%">
</div>
<div class="track-text">
           <p >Adán y Eva</p>
            <small >Paulo Londra</small>
       </div>
<div class="player-controls">
    <div class="buttons-group">
        <img src="../Assets/icons/dar-un-paso-atras.png" class="control-icon" >
        <audio controls class="custom-audio-player">
            <source src="../Assets/sounds/Adan y Eva.mp3">
        </audio>
        <img src="../Assets/icons/dar-un-paso-adelante.png" class="control-icon" >
    </div>
</div>

<div class="volume-controls">
    <span><img src="../Assets/icons/volumen.png"ss></span>
    <input type="range" class="volume-range" min="0" max="100" value="70">
</div>
</footer>
</div>
<script src="../Js/store.js"></script>
</body>
</html>
